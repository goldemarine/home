<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ardian Ars.</title>
  <meta name="description" content="Multimedia Designer — Yogyakarta, Indonesia">
  <meta name="theme-color" content="#ffffff">
  <!-- Favicon dari foto GitHub -->
  <link rel="icon" href="https://github.com/goldemarine.png?size=64">

  <style>
    :root {
      --blue: #0071e3;
      --blue-dark: #0058b0;
      --blue-soft: #eaf3ff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #e5eaf2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
                   "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating box */
    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow:
        0 2px 6px rgba(0, 113, 227, .06),
        0 24px 60px -12px rgba(0, 113, 227, .22);
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 0 0 2px var(--blue-soft), 0 10px 24px rgba(0, 113, 227, .25);
    }

    h1 {
      margin-top: 20px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .bio {
      margin: 6px auto 0;
      max-width: 30ch;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--muted);
    }

    /* 3 ikon di bawah foto profil */
    .icons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 22px 0 28px;
    }

    .icons a {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: background .2s, color .2s, transform .2s;
    }

    .icons a:hover { background: var(--blue); color: #fff; transform: translateY(-2px); }

    .icons svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tombol tautan */
    .links { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: block;
      padding: 15px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(0, 113, 227, .15);
    }

    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }

    footer { margin-top: 28px; font-size: .8rem; color: var(--muted); }

    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    @media (min-width: 768px) {
      .card { max-width: 460px; padding: 48px 36px 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- Foto otomatis dari GitHub: ganti USERNAME dengan username GitHub kamu -->
    <img class="avatar" src="https://github.com/USERNAME.png?size=256" alt="Foto profil Ardian Ars.">

    <h1>Ardian Ars.</h1>
    <p class="bio">Multimedia Designer di Yogyakarta. Terbuka untuk freelance &amp; fulltime.</p>

    <!-- 3 ICON: ganti href dengan tautan kamu -->
    <nav class="icons" aria-label="Kontak dan media sosial">
      <a href="mailto:emailkamu@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      </a>
      <a href="https://instagram.com/USERNAME_IG" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>
      </a>
      <a href="https://www.behance.net/USERNAME_BEHANCE" target="_blank" rel="noopener" aria-label="Behance">Bē</a>
    </nav>

    <!-- TOMBOL: salin satu baris <a class="btn"> untuk menambah tombol baru -->
    <section class="links" aria-label="Tautan">
      <a class="btn primary" href="https://www.behance.net/USERNAME_BEHANCE" target="_blank" rel="noopener">Lihat Portofolio</a>
      <a class="btn" href="https://github.com/USERNAME" target="_blank" rel="noopener">GitHub</a>
      <a class="btn" href="https://wa.me/628123456789" target="_blank" rel="noopener">Hubungi via WhatsApp</a>
      <a class="btn" href="https://contoh.com" target="_blank" rel="noopener">Teks Tombol</a>
    </section>

    <footer>© 2026 Ardian Ars.</footer>
  </main>
</body>
</html>
