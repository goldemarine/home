<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ardian Ars.</title>
  <meta name="description" content="Multimedia Designer — Yogyakarta, Indonesia">
  <meta name="theme-color" content="#ffffff">
  <!-- Favicon -->
  <link rel="icon" href="https://github.com/goldemarine.png?size=64">

  <style>
    :root {
      --blue: #0071e3;
      --blue-dark: #0058b0;
      --blue-soft: #eaf3ff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #e5eaf2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
                   "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Kothak ngambang */
    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow:
        0 2px 6px rgba(0, 113, 227, .06),
        0 24px 60px -12px rgba(0, 113, 227, .22);
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 0 0 2px var(--blue-soft), 0 10px 24px rgba(0, 113, 227, .25);
    }

    h1 {
      margin-top: 20px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .bio {
      margin: 6px auto 0;
      max-width: 30ch;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--muted);
    }

    /* Lambang-lambang */
    .icons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 22px 0 28px;
    }

    .icons a {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: background .2s, color .2s, transform .2s;
    }

    .icons a:hover { background: var(--blue); color: #fff; transform: translateY(-2px); }

    .icons svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tombol */
    .links { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: block;
      padding: 15px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(0, 113, 227, .15);
    }

    /* Tombol mawi warni ingkang kapundhut saking variabel --c, ingkang dipunisi piyambak-piyambak miturut saben tombol */
    .btn.solid { background: var(--c); border-color: var(--c); color: #fff; }
    .btn.solid:hover { filter: brightness(.9); border-color: var(--c); }

    footer { margin-top: 28px; font-size: .8rem; color: var(--muted); }

    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    @media (min-width: 768px) {
      .card { max-width: 460px; padding: 48px 36px 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- Potret Dhiri -->
    <img class="avatar" src="https://github.com/goldemarine.png?size=256" alt="Foto profil Ardian Ars.">

    <h1>Ardian Ars.</h1>
    <p class="bio">Visual Designer &amp; Illustrator.<br>📍 Yogyakarta, Indonesia.</p>

    <!-- Tiga Lambang: Pranala -->
    <nav class="icons" aria-label="Kontak dan media sosial">
      <a href="mailto:goldemarine@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      </a>
      <a href="https://instagram.com/goldemarine" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>
      </a>
      <a href="https://www.behance.net/ardian-ars" target="_blank" rel="noopener" aria-label="Behance">Bē</a>
    </nav>

    <section class="links" id="links" aria-label="Tautan"></section>

    <footer>© 2025 Ardian Aryasena.</footer>
  </main>

  <script>
    /* Masih junior, bang, jangan di-bully :D */
    const LINKS = [
      { text: "Portfolio",      url: "https://www.behance.net/ardian-ars", color: "#0071e3" },
      { text: "Steam",                url: "https://steamcommunity.com/id/goldemarine/",              color: "#1d1d1f" },
      { text: "Discord",  url: "https://discord.com/users/530811178935517190",               color: "#5865f1" },
      { text: "Blogspot",  url: "https://ardianaryasena.blogspot.com/",               color: "#f37c02" },
      { text: "Download CV",           url: "#",                                        color: "" },
    ];

    const box = document.getElementById("links");
    LINKS.forEach(({ text, url, color }) => {
      const a = document.createElement("a");
      a.className = "btn" + (color ? " solid" : "");
      a.href = url;
      a.textContent = text;
      if (color) a.style.setProperty("--c", color);
      if (/^https?:/.test(url)) { a.target = "_blank"; a.rel = "noopener"; }
      box.appendChild(a);
    });
  </script>
</body>
</html>
